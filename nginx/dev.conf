server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        access_log off;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # /robots.txt has no location block on purpose — see
    # nginx/prod/templates/wagerwise.conf.template for why: it needs to fall
    # through to index.php so Rank Math can inject its Sitemap: line.
    #
    # /favicon.ico DOES get a real static file here (a favicon checker wants
    # an actual reachable file at the root, not WordPress's redirect-based
    # virtual fallback) — served straight off disk from the theme, bypassing
    # PHP entirely.
    location = /favicon.ico {
        alias /var/www/html/wp-content/themes/wagerwise/assets/images/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # nginx's bundled mime.types doesn't know .webmanifest, so it'd otherwise
    # serve it as application/octet-stream.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        expires 7d;
        access_log off;
    }
}
