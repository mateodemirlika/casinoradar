# Used explicitly on the production host:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (docker-compose.override.yml is NOT loaded since it's not named on the CLI)
services:
  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile.prod
    volumes:
      - wp_core:/var/www/html
      - wp_content_prod:/var/www/html/wp-content
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  wpcli:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile.prod
    volumes:
      - wp_core:/var/www/html
      - wp_content_prod:/var/www/html/wp-content
      - ./wp-cli:/var/www/html/wp-cli-scripts
    entrypoint: ["wp", "--allow-root", "--path=/var/www/html"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [wagerwise]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - wp_core:/var/www/html:ro
      - wp_content_prod:/var/www/html/wp-content:ro
      - ./nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod/templates:/etc/nginx/templates:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.casinoradar.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.casinoradar.entrypoints=websecure"
      - "traefik.http.routers.casinoradar.tls.certresolver=letsencrypt"
      - "traefik.http.services.casinoradar.loadbalancer.server.port=80"
    networks: [wagerwise, proxy]

networks:
  proxy:
    external: true

volumes:
  wp_core:
  wp_content_prod:
  redis_data:
